current_step_summary: Восемь SKU — по одному из каждой товарной группы — добавлены в акцию Ozon. Сохранить условия теста до 14 сентября и затем снять недельную статистику.
plan:
  - Сохранить участие выбранных восьми SKU в акции Ozon до окончания недельного окна
  - По возможности не менять у выбранных SKU карточки, остатки и другие условия продвижения во время теста
  - 14 сентября снять показы, заказы, сумму заказов, цену и остаток по всем SKU
  - Для каждого выбранного SKU сравнить результат с его собственной базовой неделей и с остальными цветами той же товарной группы
  - Рассчитать заказы на 1 000 показов для экспериментальной и контрольной совокупностей
  - Не считать рост одних показов достаточным бизнес-результатом без заказов
expected_result: Получена недельная статистика по восьми акционным SKU и их групповым контролям; определено, дала ли акция Ozon прирост заказов на 1 000 показов, а не только изменение видимости
