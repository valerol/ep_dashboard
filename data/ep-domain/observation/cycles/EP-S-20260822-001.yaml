expected_result: Получена следующая недельная статистика; оценён результат эластичного бустинга 15% для четырёх SKU и возможный сопутствующий эффект на цветовые варианты; принято решение о продолжении или изменении действия
actual_result: За последние 7 дней зафиксирован 1 заказ на 2 900 ₽ при 4 076 показах. Продвигаемые четыре SKU получили суммарно 898 показов против примерно 894 на предыдущей неделе, то есть сохранили трафик на фоне общего падения показов примерно на 10%. Остальные SKU снизились примерно на 13%. Ни один продвигаемый SKU не дал заказа; единственная продажа пришлась на chi-ancientpottery-black. Эластичный бустинг показал измеримый эффект удержания видимости, но не дал конверсии в продажи.
