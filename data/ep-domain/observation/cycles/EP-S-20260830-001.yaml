plan:
  - Использовать chi-vintagerosemandala-pine как экспериментальный SKU для теста главного изображения
  - Использовать chi-ethniclanna-mint как контрольный SKU без изменений карточки для теста изображения
  - Сохранить текущий эластичный бустинг 15% на продвигаемых SKU без изменения рекламного фактора до завершения теста
  - Использовать новое главное изображение chi-vintagerosemandala-pine в формате 3:4
  - Не менять цену, описание и остальные существенные элементы chi-vintagerosemandala-pine в течение теста
  - Использовать chi-teardropmandala-navy как экспериментальный SKU для теста контент-рейтинга
  - Сохранить по возможности цену, продвижение, главное изображение и структуру карточки chi-teardropmandala-navy неизменными после повышения контент-рейтинга
  - Через 7 дней снять аналитику Ozon и оценить оба эксперимента раздельно
expected_result: Получены измеримые данные о влиянии главного изображения на конверсию chi-vintagerosemandala-pine и о влиянии повышения контент-рейтинга на показы chi-teardropmandala-navy
actual_result: За неделю магазин получил 3 571 показ, 1 заказ на 2 455 ₽; заказ пришёлся на контрольный chi-ethniclanna-mint. После замены главного изображения chi-vintagerosemandala-pine вырос с 350 до 383 показов (+9,4%), тогда как контрольный chi-ethniclanna-mint снизился с 290 до 248 (−14,5%), но экспериментальный SKU не получил заказов, поэтому влияние изображения на конверсию не подтверждено. После повышения контент-рейтинга chi-teardropmandala-navy сохранил показы почти на прежнем уровне — 50 против 49 (−2,0%) — на фоне снижения сопоставимых sibling-SKU семейства с 474 до 361 (−23,8%); относительный сигнал видимости есть, но продаж нет и причинная связь не доказана. Оба эксперимента закрыты; следующим шагом выбрано подключение «МоегоСклада» к Ozon с пересечением с проектом маркировки.
