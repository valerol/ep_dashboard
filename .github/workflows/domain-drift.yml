name: Domain drift

on:
  push:
    branches: [main]
    paths:
      - "data/ep-domain/**"
      - "scripts/check-domain-drift.mjs"
      - "tests/domain-drift.test.mjs"
      - ".github/workflows/domain-drift.yml"
  pull_request:
    paths:
      - "data/ep-domain/**"
      - "scripts/check-domain-drift.mjs"
      - "tests/domain-drift.test.mjs"
      - ".github/workflows/domain-drift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-domain-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - run: node scripts/check-domain-drift.mjs
