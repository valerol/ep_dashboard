name: Calendar cycle projection

on:
  push:
    branches: [main]
    paths:
      - data/ep-domain/observation/cycles/**
      - scripts/sync-google-calendar.mjs
      - tests/calendar-sync.test.mjs
      - .github/workflows/calendar-sync.yml
      - package.json
      - package-lock.json
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate calendar projection
        run: npm run test:calendar-sync && npm run sync:calendar:dry-run
      - name: Check calendar credentials
        id: calendar_credentials
        env:
          EP_GOOGLE_CALENDAR_ID: ${{ secrets.EP_GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$EP_GOOGLE_CALENDAR_ID" ] && [ -n "$GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Calendar sync skipped: repository secrets are not configured."
          fi
      - name: Synchronize Elephant Pants calendar
        if: steps.calendar_credentials.outputs.enabled == 'true'
        env:
          EP_GOOGLE_CALENDAR_ID: ${{ secrets.EP_GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON }}
        run: npm run sync:calendar
